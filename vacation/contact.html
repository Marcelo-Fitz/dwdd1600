<!-- v2 -->

<body>
    <!-- start the page head -->
    <header>
        <span>Tropics Vacations</span>
    </header>

    <!-- start the page navigation -->
    <nav>
        <ul>
            <li ><a href="index.html">Home</a></li>
            <li><a href="packages.html">Packages</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="media.html">Media</a></li>
            <li class="active"><a href="contact.html">Contact</a></li>
        </ul>


    </nav>

    <!-- start the main content -->
    <main>

        <h1>Contact Us</h1>

    <form method="get" class="myForm" action="thanks.html">
        <fieldset>
        <legend>Personal Information</legend>
        <label>Full Name*<input type="text" name="fname" required></label>
        <label>Email*<input type="email" name="email" required></label>
        <label>Cell Number*<input type="tel" name="phone" required placeholder="123-456-7890"></label>
        </fieldset>

        <fieldset>
        <legend>Type of Vacation</legend>
       <label><input type="radio" name="method" value="single">Single Destination</label>
       <label><input type="radio" name="method" value="package">Package Deal</label>
       <label><input type="radio" name="method" value="multi">Multiple Destinations</label>
        </fieldset>

        <fieldset>
            <label>Membership
            <select name="membership">
                <option value="none">Please Select</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
                <option value="Gold">Gold</option>
            </select>
            </label>
        </fieldset>   

        <label>Comments 
            <textarea name="comments" placeholder="Please add any special instructions here."></textarea>
        </label>

        <input type="submit" value="Send Information Request">
        </form>
    </main>
    <!-- start the page footer -->
    <footer>
